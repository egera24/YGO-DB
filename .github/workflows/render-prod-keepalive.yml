name: Render prod keep-alive

on:
  schedule:
    # Every 10 minutes during UTC hours that cover Europe/Budapest 08:00–22:00 (CET/CEST).
    # In-job zoneinfo gate skips runs outside the local window.
    - cron: "*/10 5-21 * * *"
  workflow_dispatch:

jobs:
  ping-prod:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping prod /api/health if in window
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import urllib.error
          import urllib.request

          now = datetime.now(ZoneInfo("Europe/Budapest"))
          if not (8 <= now.hour < 22):
              print(f"Skip outside 08:00-22:00 Budapest: {now.isoformat()}")
              raise SystemExit(0)

          url = "https://ygo-app-jyek.onrender.com/api/health"
          try:
              with urllib.request.urlopen(url, timeout=60) as r:
                  body = r.read().decode()
                  print(f"OK {r.status} {body}")
          except urllib.error.HTTPError as e:
              print(f"HTTP {e.code}: {e.reason}")
              raise SystemExit(1)
          except urllib.error.URLError as e:
              print(f"URL error: {e.reason}")
              raise SystemExit(1)
          PY

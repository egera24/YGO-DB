# Free web apps + external Neon Postgres. See docs/DEPLOY_FREE.md and docs/ENVIRONMENTS.md
# Paid Render Postgres + cron import: render-paid.yaml
services:
  # Staging — deploys from develop; set DATABASE_URL to Neon *dev* branch in Dashboard
  - type: web
    name: ygo-app-dev
    runtime: python
    plan: free
    branch: develop
    buildCommand: pip install -r requirements.txt && pip install rjsmin csscompressor && python scripts/minify_static.py && python -m ygo_app.db_migrate
    startCommand: uvicorn ygo_app.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: EMAIL_BACKEND
        value: brevo
      # Optional OAuth — set OAUTH_REDIRECT_BASE_URL to this service's public URL
      # (e.g. https://ygo-app-dev.onrender.com) plus provider client id/secret pairs.
    healthCheckPath: /api/health
  - type: web
    name: ygo-app
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt && pip install rjsmin csscompressor && python scripts/minify_static.py && python -m ygo_app.db_migrate
    startCommand: uvicorn ygo_app.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: EMAIL_BACKEND
        value: brevo
      # Optional OAuth — set OAUTH_REDIRECT_BASE_URL to this service's public URL
      # (e.g. https://ygo-app-jyek.onrender.com) plus provider client id/secret pairs.
    healthCheckPath: /api/health
